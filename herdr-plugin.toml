id = "herdr-plugin-msb"
name = "Microsandbox"
version = "0.1.0"
min_herdr_version = "0.9.0"
platforms = ["linux", "macos"]

[[build]]
command = ["make", "build"]
platforms = ["linux"]

[[build]]
command = ["sh", "-c", "ARCH=$(uname -m | sed 's/x86_64/amd64/'); cp dist/herdr-plugin-msb-linux-amd64 herdr-plugin-msb && cp dist/herdr-plugin-msb-agent-darwin-${ARCH} herdr-plugin-msb-agent && chmod +x herdr-plugin-msb herdr-plugin-msb-agent"]
platforms = ["macos"]

[[panes]]
id = "shell"
title = "Microsandbox guest shell"
placement = "tab"
command = ["sh", "-c", 'exec sh "$HERDR_PLUGIN_ROOT/plugins/herdr/bin/pane.sh" shell']

[[panes]]
id = "notify"
title = "Microsandbox notification"
placement = "overlay"
command = ["sh", "-c", "printf '%s\\n%s\\n' \"$HERDR_NOTIFY_TITLE\" \"$HERDR_NOTIFY_BODY\"; read -r _"]

[[panes]]
id = "ports"
title = "Port forwards"
placement = "tab"
command = ["herdr-plugin-msb", "ports-pane"]

[[actions]]
id = "sandbox-list"
title = "List Sandboxes"
command = ["herdr-plugin-msb", "list"]
contexts = ["workspace"]
platforms = ["linux"]

[[actions]]
id = "ports-declare"
title = "Declare Guest Ports"
command = ["herdr-plugin-msb", "declare", "--notify"]
contexts = ["workspace"]
platforms = ["linux"]

[[actions]]
id = "ports-status"
title = "Port Forward Status"
command = ["herdr-plugin-msb", "status"]
contexts = ["workspace"]
platforms = ["linux"]

[[actions]]
id = "space-open-pane"
title = "Open Guest Shell Pane"
command = ["herdr-plugin-msb", "space-open-pane"]
contexts = ["workspace"]
platforms = ["linux"]

[[actions]]
id = "new-tab"
title = "New Tab (guest pane in msb spaces, host tab elsewhere)"
command = ["herdr-plugin-msb", "new-tab"]
contexts = ["workspace"]
platforms = ["linux"]

[[actions]]
id = "space-convert"
title = "Convert This Workspace to a Sandbox"
command = ["herdr-plugin-msb", "space-convert"]
contexts = ["workspace"]
platforms = ["linux"]

[[actions]]
id = "ports-open"
title = "Port forwards"
command = ["herdr", "plugin", "pane", "open", "--plugin", "herdr-plugin-msb", "--pane-id", "ports"]
contexts = ["workspace"]
platforms = ["linux"]

[[events]]
on = "worktree.created"
command = ["sh", "plugins/herdr/bin/on-worktree-created.sh"]
platforms = ["linux"]

[[events]]
on = "worktree.removed"
command = ["sh", "plugins/herdr/bin/on-worktree-removed.sh"]
platforms = ["linux"]

[[actions]]
id = "ports-toggle"
title = "Toggle Port Forward"
command = ["herdr-plugin-msb", "ports-toggle"]
contexts = ["workspace"]
platforms = ["linux"]

[[startup]]
command = ["herdr-plugin-msb-agent", "local-agent-startup"]
platforms = ["linux", "macos"]

[[link_handlers]]
id = "local-port"
title = "Local Port"
pattern = 'http://127\.\d+\.\d+\.\d+:\d+'
action = "ports-toggle"

[[link_handlers]]
id = "local-port-localhost"
title = "Local Port (localhost)"
pattern = 'http://localhost:\d+'
action = "ports-toggle"
