id = "herdr-plugin-msb"
name = "Microsandbox"
version = "0.1.0"
min_herdr_version = "0.8.0"
platforms = ["linux"]

[[build]]
command = ["make", "build"]

[[panes]]
id = "shell"
title = "Microsandbox guest shell"
placement = "tab"
command = ["sh", "-c", 'exec sh "$HERDR_PLUGIN_ROOT/plugins/herdr/bin/pane.sh" shell']

[[panes]]
id = "notify"
title = "Microsandbox notification"
placement = "overlay"
command = ["sh", "-c", "printf '%s\\n%s\\n' \"$HERDR_NOTIFY_TITLE\" \"$HERDR_NOTIFY_BODY\"; read -r _"]

[[actions]]
id = "sandbox-list"
title = "List Sandboxes"
command = ["herdr-plugin-msb", "list"]
contexts = ["workspace"]
platforms = ["linux"]

[[actions]]
id = "ports-declare"
title = "Declare Guest Ports"
command = ["herdr-plugin-msb", "declare", "--notify"]
contexts = ["workspace"]
platforms = ["linux"]

[[actions]]
id = "ports-status"
title = "Port Forward Status"
command = ["herdr-plugin-msb", "status"]
contexts = ["workspace"]
platforms = ["linux"]

[[actions]]
id = "space-open-pane"
title = "Open Guest Shell Pane"
command = ["herdr-plugin-msb", "space-open-pane"]
contexts = ["workspace"]
platforms = ["linux"]

[[actions]]
id = "new-tab"
title = "New Tab (guest pane in msb spaces, host tab elsewhere)"
command = ["herdr-plugin-msb", "new-tab"]
contexts = ["workspace"]
platforms = ["linux"]

[[actions]]
id = "space-convert"
title = "Convert This Workspace to a Sandbox"
command = ["herdr-plugin-msb", "space-convert"]
contexts = ["workspace"]
platforms = ["linux"]

[[events]]
on = "worktree.created"
command = ["sh", "plugins/herdr/bin/on-worktree-created.sh"]
platforms = ["linux"]

[[events]]
on = "worktree.removed"
command = ["sh", "plugins/herdr/bin/on-worktree-removed.sh"]
platforms = ["linux"]

[[link_handlers]]
id = "local-port"
title = "Local Port"
pattern = 'http://127\.0\.0\.1:\d+'
action = "ports-declare"

[[actions]]
id = "linkenv-probe-dump"
title = "Link Env Probe (dump argv + env)"
command = ["sh", "-c", 'F=/tmp/herdr-linkenv-probe.txt; { printf "=== argv: %s\n" "$@"; env | sort; } > "$F" 2>&1', "_"]
contexts = ["workspace"]
platforms = ["linux"]

[[link_handlers]]
id = "linkenv-probe"
title = "Link Env Probe"
pattern = 'http://127\.0\.0\.2:59999'
action = "linkenv-probe-dump"
